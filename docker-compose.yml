name: beads-ui

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: beads-ui-web:local
    network_mode: host
    environment:
      BEADS_UI_REPO: ${BEADS_UI_REPO:-}
      BEADS_UI_PORT: ${BEADS_UI_PORT:-4810}
    volumes:
      - beads-ui-work:/work
      - beads-ui-home:/root
    restart: unless-stopped

volumes:
  beads-ui-work:
  beads-ui-home:
