---

default_stages: [pre-commit]

exclude: ^\.beads/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: \.jinja$
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^docs/asks/
      - id: trailing-whitespace
        exclude: ^docs/asks/
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: (^|/)uv\.lock$
      - id: detect-private-key
        exclude: ^(tests?/fixtures/|docs/examples?/)
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: ^(\.claude/|\.githooks/|node_modules/|docs/research/)

  # ── Secrets: gitleaks (public repo; T-0.4) ──────────────────────────────
  # Scans the staged diff and refuses the commit on any secret-pattern match.
  # The golang hook builds gitleaks itself. plugins/beads-ui/test/hygiene.spec.ts (npm test)
  # runs the gitleaks on PATH against a staged fabricated key and checks it is this rev, so a
  # contributor installs it too (CONTRIBUTING.md, Setup).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: validate-claude-settings
        name: validate .claude/settings.json hook script refs exist
        entry: validate-claude-settings
        language: system
        pass_filenames: false
        always_run: true
      - id: comment-ratchet
        name: comment ratchet (no new code comments; comment-baseline.json only shrinks)
        entry: python3 scripts/comment_ratchet.py
        language: system

      # The repo's own gates (beads-ui design, Phase 0): Biome, the core purity
      # gate and the core type check, then Vitest. Both need `npm ci` first and
      # fail loudly without it.
      - id: npm-lint
        name: npm run lint (Biome, core purity gate, core type check)
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
      # The two test hooks skip a commit whose staged paths are all docs/** or *.md
      # (scripts/test-hook.mjs), and BEADS_UI_TEST_JOBS bounds how many test processes they
      # start (default 1, at most 2; docs/procedures/web-run.md, Test it).
      - id: npm-test
        name: npm test (Vitest, then the mod's tests file by file)
        entry: node scripts/test-hook.mjs npm test
        language: system
        pass_filenames: false
        always_run: true

      # The mod's gates (beads-ui design, D-15 and T-0.3). Each needs `claude` on PATH
      # and fails loudly without it.
      - id: plugin-validate-allowlist
        name: claude plugin validate --json plugins/beads-ui matches its allow-list
        entry: node scripts/check-plugin-allowlist.mjs plugins/beads-ui plugins/beads-ui/validate-allowlist.json
        language: system
        pass_filenames: false
        always_run: true
      - id: marketplace-validate
        name: claude plugin validate . (the marketplace lists ./plugins/beads-ui)
        entry: node scripts/check-marketplace.mjs . ./plugins/beads-ui
        language: system
        pass_filenames: false
        always_run: true
      - id: plugin-size
        name: no tracked or staged file under plugins/beads-ui over 1 MB
        entry: node scripts/check-plugin-size.mjs plugins/beads-ui
        language: system
        pass_filenames: false
        always_run: true
      - id: plugin-test
        name: claude plugin test plugins/beads-ui, file by file (the mod's tests and the import probe)
        entry: node scripts/test-hook.mjs node scripts/plugin-test.mjs plugins/beads-ui
        language: system
        pass_filenames: false
        always_run: true

      # Every change to shipped plugin files raises the plugin's version above main's
      # (feat -> minor, else patch; a major only with Sergei's trailer). When the
      # pushed branch falls short this commits the raise itself and fails the push
      # once; push again. docs/procedures/releasing.md.
      - id: plugin-version
        name: plugin version is above main's when shipped plugin files changed
        entry: node scripts/plugin-version.mjs pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      # docs-index-check REMOVED. The generated docs/README.md index had
      # no reader -- nothing in the fleet consumed it -- yet the gate blocked every
      # docs commit until it was regenerated. It also could not be regenerated
      # correctly from a linked worktree, so the only in-worktree remedy
      # was its own forbidden SKIP=docs-index-check bypass. Removed deliberately,
      # gate-first: docs/README.md content is untouched by this change.
      - id: test-gate
        name: test gate (mise-aware, tech-stack auto-detect)
        entry: test-gate
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: bd-precommit-validate
        name: bd dual-ID invariant (a staged .beads/issues.jsonl mirror, if tracked)
        entry: bd-precommit-validate
        language: system
        pass_filenames: false
        always_run: true
      - id: bd-blocked-comment
        name: every blocked Beads issue carries its transition comment
        entry: bash -c 'bd-blocked-check --current-repo --stage; rc=$?; if [ "$rc" -eq 2 ]; then exit 0; fi; exit "$rc"'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: public-repo-name-check
        name: no employer infrastructure names in a public repo
        entry: public-repo-name-check
        language: system
        stages: [pre-commit]
        types: [text]
        exclude: ^docs/asks/
