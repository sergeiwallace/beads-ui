<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>beads-ui</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: var(--font-sans, system-ui, sans-serif);
        background: var(--color-background-primary, Canvas);
        color: var(--color-text-primary, CanvasText);
      }
      main {
        padding: 12px;
      }
      section,
      li {
        border: var(--border-width-regular, 1px) solid var(--color-border-primary, GrayText);
        border-radius: var(--border-radius-md, 8px);
        padding: 12px;
        margin-bottom: 12px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      input,
      textarea,
      button {
        font: inherit;
        color: inherit;
        background: var(--color-background-secondary, Field);
        border: var(--border-width-regular, 1px) solid var(--color-border-secondary, GrayText);
        border-radius: var(--border-radius-sm, 4px);
        padding: 4px 8px;
      }
      textarea {
        width: 100%;
        min-height: 4em;
        box-sizing: border-box;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="drafts-heading">
        <h2 id="drafts-heading">Drafted prompts</h2>
        <p id="no-drafts">No drafted prompt is waiting here.</p>
        <ul id="drafts"></ul>
      </section>
      <section aria-labelledby="send-heading">
        <h2 id="send-heading">Send a prompt</h2>
        <form id="send">
          <label>Repository <input name="repo" required /></label>
          <label>Task <input name="task" required /></label>
          <label>Prompt <textarea name="text" required></textarea></label>
          <button type="submit">Send</button>
        </form>
        <fieldset id="send-confirm" hidden>
          <legend>Send this prompt?</legend>
          <p id="send-confirm-target"></p>
          <pre id="send-confirm-text"></pre>
          <button type="button" id="send-confirm-yes">Send it</button>
          <button type="button" id="send-confirm-no">Cancel</button>
        </fieldset>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script type="module">
      /* ext-apps */
    </script>
    <script type="module">
      /* view */
    </script>
  </body>
</html>
